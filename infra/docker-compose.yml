# AIRR full stack — sovereign, self-hosted, air-gap capable.
# For DC/staging deployment. Local dev still uses native services (see infra/README.md).
# NOTE: pgvector/pgai image pulls require registry access; in air-gap, pre-load images.

services:
  db:
    image: timescale/timescaledb-ha:pg17   # includes pgvector + pgai; swap for vanilla pg17 if preferred
    environment:
      POSTGRES_DB: airr
      POSTGRES_USER: airr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airr_local_pw}
    volumes:
      - airr_db:/home/postgres/pgdata/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airr -d airr"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_DATABASE: airr
      DB_USERNAME: airr
      DB_PASSWORD: ${DB_PASSWORD:-airr_local_pw}
      AIRR_EDITION: ${AIRR_EDITION:-standard}
      RAG_API_URL: http://rag_api:8001
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db: { condition: service_healthy }
    ports: ["9000:9000"]

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports: ["9100:80"]
    depends_on: [backend]

  rag_api:
    build:
      context: ../services/rag_api
    environment:
      VECTOR_DB_TYPE: pgvector
      DB_HOST: db
      POSTGRES_DB: airr
      POSTGRES_USER: airr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airr_local_pw}
      COLLECTION_NAME: airr_kb
      EMBEDDINGS_PROVIDER: huggingface
      EMBEDDINGS_MODEL: sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      db: { condition: service_healthy }
    ports: ["8001:8001"]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  airr_db:
  ollama:
