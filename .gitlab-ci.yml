# AIRR CI/CD — GitLab CE (sovereign primary).
# Stages: validate -> build -> deploy. Tests run on sqlite in-memory (no DB service needed).
# Deploy jobs are manual + environment-scoped, matching the AIRR DevOps "Releases/Environments" menu.

stages:
  - validate
  - build
  - deploy

variables:
  PHP_IMAGE: "php:8.3-cli"
  NODE_IMAGE: "node:22-alpine"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

# ---------------- VALIDATE ----------------

backend:test:
  stage: validate
  image: $PHP_IMAGE
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths: [.composer-cache/, backend/vendor/]
  before_script:
    - apt-get update -yqq && apt-get install -yqq git unzip libpq-dev libzip-dev
    - docker-php-ext-install pdo pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --no-interaction --prefer-dist --no-progress
    - cp .env.example .env || true
    - php artisan key:generate
    - php artisan test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

frontend:build:
  stage: validate
  image: $NODE_IMAGE
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------- BUILD (container images -> GitLab registry) ----------------

build:images:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -f infra/backend.Dockerfile .
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -f infra/frontend.Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ---------------- DEPLOY (per environment; triggered from AIRR "Releases") ----------------

.deploy_template: &deploy
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - echo "Deploying $CI_COMMIT_SHORT_SHA to $DEPLOY_ENV"
    # Placeholder: ssh into the environment host and pull the new images / promote CRA.
    # Real deploy logic added once environment hosts exist.
    - 'echo "TODO: ssh $DEPLOY_HOST -> docker compose pull && up -d"'

deploy:staging:
  <<: *deploy
  variables: { DEPLOY_ENV: "staging" }
  environment: { name: staging, url: https://staging.airr.local }
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:production:
  <<: *deploy
  variables: { DEPLOY_ENV: "production" }
  environment: { name: production, url: https://airr.technology }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual   # Prod requires manual DevOps approval
